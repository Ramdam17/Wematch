# Wematch CI — build both targets + run unit tests
#
# OPEN DECISION (plan 0.8): GitHub-hosted macOS runner vs self-hosted on the dev Mac.
# This workflow targets GitHub-hosted `macos-26`. If the Xcode/iOS-26 simulator combo
# is unavailable on hosted runners, switch `runs-on` to a self-hosted label.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      # GoogleService-Info.plist is gitignored (secret). Build needs a placeholder;
      # runtime Firebase behavior is NOT exercised in unit tests.
      - name: Provide Firebase plist placeholder
        run: |
          if [ ! -f Wematch/GoogleService-Info.plist ]; then
            cat > Wematch/GoogleService-Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>API_KEY</key><string>ci-placeholder</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>PLIST_VERSION</key><string>1</string>
            <key>BUNDLE_ID</key><string>com.remyramadour.Wematch</string>
            <key>PROJECT_ID</key><string>ci-placeholder</string>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000000000</string>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_APPINVITE_ENABLED</key><false/>
            <key>IS_GCM_ENABLED</key><true/>
            <key>IS_SIGNIN_ENABLED</key><true/>
          </dict></plist>
          EOF
          fi

      - name: Build iPhone app
        run: |
          xcodebuild -scheme Wematch \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            build CODE_SIGNING_ALLOWED=NO | tail -50

      - name: Build Watch app
        run: |
          xcodebuild -scheme "WematchWatch Watch App" \
            -destination 'generic/platform=watchOS Simulator' \
            build CODE_SIGNING_ALLOWED=NO | tail -50

      # Enabled once the WematchTests target is wired (plan 0.5).
      - name: Run unit tests
        run: |
          if xcodebuild -scheme Wematch -showBuildSettings 2>/dev/null | grep -q "WematchTests"; then
            xcodebuild test -scheme Wematch \
              -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
              CODE_SIGNING_ALLOWED=NO | tail -80
          else
            echo "::warning::WematchTests target not wired yet (plan 0.5) — skipping tests"
          fi

  lint:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint --strict --reporter github-actions-logging
